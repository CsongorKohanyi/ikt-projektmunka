<section class="container px-4 py-5">
    <h1 class="mb-4">Regisztráció</h1>
    <p>Add meg az adataidat a regisztrációhoz.</p>

    <form id="register-form" class="col-12 col-md-6">
        <label for="register-name" class="form-label">Név</label>
        <input type="text" class="form-control mb-3" id="register-name" name="nev" autocomplete="name" required>

        <label for="register-email" class="form-label">E-mail-cím</label>
        <input type="email" class="form-control mb-3" id="register-email" name="email" autocomplete="email" required>

        <label for="register-password" class="form-label">Jelszó</label>
        <input type="password" class="form-control mb-3" id="register-password" name="jelszo" autocomplete="new-password" required>

        <label for="register-phone" class="form-label">Telefonszám</label>
        <input type="tel" class="form-control mb-3" id="register-phone" name="telefon" autocomplete="tel" required>

        <button type="submit">Regisztrálok</button>
    </form>

    <a href="#login">Vissza a bejelentkezéshez</a>
</section>
